services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: waiver_app
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d waiver_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: waiver_app
      PORT: "4000"
      ADMIN_PASSCODE: changeme
      # Waiver confirmation email over SMTP. Unset locally by default, in which
      # case submissions still save and the send is skipped with a warning.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-true}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      WAIVER_NOTIFY_EMAIL: "${WAIVER_NOTIFY_EMAIL:-gravitasmma@gmail.com}"
      GYM_NAME: "${GYM_NAME:-Gravitas Mixed Martial Arts}"
      GYM_SHORT_NAME: "${GYM_SHORT_NAME:-Gravitas}"
      GYM_PHONE: "${GYM_PHONE:-}"
      GYM_ADDRESS: "${GYM_ADDRESS:-}"
      GYM_WEBSITE_URL: "${GYM_WEBSITE_URL:-}"
      SIGNUP_URL: "${SIGNUP_URL:-}"
      ACCOUNT_PORTAL_URL: "${ACCOUNT_PORTAL_URL:-}"
      SCHEDULE_URL: "${SCHEDULE_URL:-}"
      # One-week follow-up email. Off locally by default so a dev database of
      # old waivers cannot mail anyone.
      FOLLOWUP_ENABLED: "${FOLLOWUP_ENABLED:-false}"
      FOLLOWUP_DELAY_DAYS: "${FOLLOWUP_DELAY_DAYS:-7}"
      FOLLOWUP_GRACE_DAYS: "${FOLLOWUP_GRACE_DAYS:-3}"
      FOLLOWUP_POLL_MINUTES: "${FOLLOWUP_POLL_MINUTES:-60}"
      DISPLAY_TIMEZONE: "${DISPLAY_TIMEZONE:-America/New_York}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    depends_on:
      - backend

volumes:
  db-data:
