apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gravitas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: your-registry/waiver-app-backend:latest
          ports:
            - containerPort: 4000
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: waiver_app
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: PGPASSWORD
            - name: ADMIN_PASSCODE
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ADMIN_PASSCODE
            - name: PORT
              value: "4000"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: gravitas
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
