apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: waiver-app
  namespace: gravitas
  annotations:
    # The photo of a paper waiver, saved from the admin page, can be larger
    # than the ingress's 1 MB default.
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
spec:
  ingressClassName: nginx
  rules:
    - host: waiver.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
