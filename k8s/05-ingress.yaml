apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: waiver-app
  namespace: gravitas
spec:
  ingressClassName: nginx
  rules:
    - host: waiver.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
