nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

secret:
  name: app-secrets
  create: true
  pgPassword: "replace-me"
  adminPasscode: "replace-me"
  # Gmail app password used to send waiver confirmation emails.
  # This is an app password, not the account password.
  smtpPassword: ""
  # Read-only Squarespace API key (Orders) for the admin members section.
  squarespaceApiKey: ""
  # Bearer token MatTracker (spartracker) issued for /api/waiver-signed.
  spartrackerWaiverToken: ""

# Non-secret waiver-email settings, passed straight through as backend env vars.
# Blank values are omitted, and the email leaves out the matching section.
email:
  # Mailbox the waiver PDFs are sent from and received at. Leave SMTP_HOST or
  # SMTP_FROM empty and nothing is sent; everything else works the same.
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_STARTTLS: "true"
  SMTP_USER: "gravitasmma@gmail.com"
  SMTP_FROM: "Gravitas Mixed Martial Arts <gravitasmma@gmail.com>"
  WAIVER_NOTIFY_EMAIL: "gravitasmma@gmail.com"
  MAIL_REPLY_TO: ""
  # Gym details and account links shown to the person who signed.
  GYM_NAME: "Gravitas Mixed Martial Arts"
  # Short, conversational form used in the follow-up email ("your free trial
  # week at Gravitas"). Falls back to GYM_NAME when empty.
  GYM_SHORT_NAME: ""
  GYM_PHONE: ""
  GYM_ADDRESS: ""
  GYM_WEBSITE_URL: ""
  SIGNUP_URL: ""
  ACCOUNT_PORTAL_URL: ""
  SCHEDULE_URL: ""
  # MatTracker, where members watch the class videos a coach tags them in.
  # Set, the confirmation email tells anyone who trains how to sign in there.
  MATTRACKER_URL: ""
  # One-week follow-up email inviting trial guests to become members.
  FOLLOWUP_ENABLED: "true"
  FOLLOWUP_DELAY_DAYS: "7"
  # How long after coming due a waiver stays eligible. Past this it is passed
  # over, so a restart after downtime never sends a batch of stale nudges.
  FOLLOWUP_GRACE_DAYS: "3"
  FOLLOWUP_POLL_MINUTES: "60"
  # Timezone used for timestamps printed on the PDF.
  DISPLAY_TIMEZONE: "America/New_York"
  # OAuth client ID for "Sign in with Google" on the admin page (not secret).
  # Empty hides the button; the passcode keeps working either way.
  GOOGLE_CLIENT_ID: ""
  # MatTracker endpoint told about each new waiver, so the people it covers
  # have accounts. Needs SPARTRACKER_WAIVER_TOKEN in the secret as well.
  SPARTRACKER_WAIVER_URL: ""

postgres:
  enabled: true
  replicaCount: 1
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    user: postgres
    database: waiver_app
  pgDataDir: /var/lib/postgresql/data/pgdata
  terminationGracePeriodSeconds: 60
  service:
    port: 5432
    targetPort: 5432
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    # Linode CSI class with reclaimPolicy: Retain so the block storage volume
    # survives PVC/StatefulSet deletion.
    storageClassName: linode-block-storage-retain
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Off-cluster daily logical backups to Linode Object Storage (S3 compatible).
backup:
  enabled: true
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  # Fails the job rather than letting it hang forever.
  activeDeadlineSeconds: 3600
  dumpImage:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  uploadImage:
    repository: amazon/aws-cli
    tag: "2.17.0"
    pullPolicy: IfNotPresent
  objectStorage:
    bucket: postgres-backups
    region: us-east-1
    endpoint: https://us-east-1.linodeobjects.com
    prefix: waiver-app
  # Secret holding AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for the Linode
  # Object Storage access key. Set create: false to use one made out-of-band
  # (see scripts/setup-object-storage.sh).
  credentialsSecret:
    name: linode-object-storage
    create: false
    accessKey: ""
    secretKey: ""
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

backend:
  replicaCount: 1
  image:
    repository: your-registry/waiver-app-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 4000
    targetPort: 4000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

frontend:
  replicaCount: 1
  image:
    repository: your-registry/waiver-app-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 128Mi

ingress:
  enabled: true
  className: nginx
  host: waiver.example.com
  annotations: {}
  paths:
    - /waiver
    - /admin
    - /
  tls:
    enabled: false
    secretName: waiver-app-tls

cloudflared:
  enabled: false
  image:
    repository: cloudflare/cloudflared
    tag: latest
    pullPolicy: IfNotPresent
  command:
    - tunnel
    - --no-autoupdate
    - run
  tokenSecret:
    name: cloudflared-tunnel-token
    key: TUNNEL_TOKEN
    create: false
    token: ""
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 100m
      memory: 128Mi
