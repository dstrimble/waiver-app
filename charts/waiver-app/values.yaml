nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

secret:
  name: app-secrets
  create: true
  pgPassword: "replace-me"
  adminPasscode: "replace-me"

postgres:
  enabled: true
  replicaCount: 1
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    user: postgres
    database: waiver_app
  pgDataDir: /var/lib/postgresql/data/pgdata
  terminationGracePeriodSeconds: 60
  service:
    port: 5432
    targetPort: 5432
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    # Linode CSI class with reclaimPolicy: Retain so the block storage volume
    # survives PVC/StatefulSet deletion.
    storageClassName: linode-block-storage-retain
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Off-cluster daily logical backups to Linode Object Storage (S3 compatible).
backup:
  enabled: true
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  # Fails the job rather than letting it hang forever.
  activeDeadlineSeconds: 3600
  dumpImage:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  uploadImage:
    repository: amazon/aws-cli
    tag: "2.17.0"
    pullPolicy: IfNotPresent
  objectStorage:
    bucket: postgres-backups
    region: us-east-1
    endpoint: https://us-east-1.linodeobjects.com
    prefix: waiver-app
  # Secret holding AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for the Linode
  # Object Storage access key. Set create: false to use one made out-of-band
  # (see scripts/setup-object-storage.sh).
  credentialsSecret:
    name: linode-object-storage
    create: false
    accessKey: ""
    secretKey: ""
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

backend:
  replicaCount: 1
  image:
    repository: your-registry/waiver-app-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 4000
    targetPort: 4000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

frontend:
  replicaCount: 1
  image:
    repository: your-registry/waiver-app-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 128Mi

ingress:
  enabled: true
  className: nginx
  host: waiver.example.com
  annotations: {}
  paths:
    - /waiver
    - /waiver/admin
    - /
  tls:
    enabled: false
    secretName: waiver-app-tls

cloudflared:
  enabled: false
  image:
    repository: cloudflare/cloudflared
    tag: latest
    pullPolicy: IfNotPresent
  command:
    - tunnel
    - --no-autoupdate
    - run
  tokenSecret:
    name: cloudflared-tunnel-token
    key: TUNNEL_TOKEN
    create: false
    token: ""
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 100m
      memory: 128Mi
