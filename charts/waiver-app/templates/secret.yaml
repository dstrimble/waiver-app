{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "waiver-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  PGPASSWORD: {{ .Values.secret.pgPassword | quote }}
  ADMIN_PASSCODE: {{ .Values.secret.adminPasscode | quote }}
  {{- /* Accept either spelling: an empty value here silently disables email. */}}
  SMTP_PASSWORD: {{ .Values.secret.smtpPassword | default .Values.secret.SMTP_PASSWORD | default "" | quote }}
  SQUARESPACE_API_KEY: {{ .Values.secret.squarespaceApiKey | default "" | quote }}
  SPARTRACKER_WAIVER_TOKEN: {{ .Values.secret.spartrackerWaiverToken | default "" | quote }}
{{- end }}
