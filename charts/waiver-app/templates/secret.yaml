{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "waiver-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  PGPASSWORD: {{ .Values.secret.pgPassword | quote }}
  ADMIN_PASSCODE: {{ .Values.secret.adminPasscode | quote }}
{{- end }}
