# Non-secret overrides for the Linode "gravitas" deployment, used by CI.
# app-secrets, linode-object-storage and cloudflared-tunnel-token already
# exist in the namespace (created out-of-band), so helm leaves them alone.
#
#   helm upgrade --install waiver-app charts/waiver-app \
#     -n gravitas --create-namespace -f charts/waiver-app/values-linode.yaml \
#     --set backend.image.tag=<tag> --set frontend.image.tag=<tag>

secret:
  name: app-secrets
  create: false

# SMTP_PASSWORD lives in the app-secrets secret created out-of-band; only the
# non-secret email settings are declared here.
email:
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_STARTTLS: "true"
  SMTP_USER: "gravitasmma@gmail.com"
  SMTP_FROM: "Gravitas Mixed Martial Arts <gravitasmma@gmail.com>"
  WAIVER_NOTIFY_EMAIL: "gravitasmma@gmail.com"
  GYM_NAME: "Gravitas Mixed Martial Arts"
  GYM_SHORT_NAME: "Gravitas"
  GYM_PHONE: "501-497-5811"
  GYM_ADDRESS: "2501 Dave Ward Dr. Suite A5 Conway, AR"
  GYM_WEBSITE_URL: "https://www.gravitasmartialarts.com/"
  SIGNUP_URL: "https://www.gravitasmartialarts.com/member-areas-4"
  ACCOUNT_PORTAL_URL: "https://www.gravitasmartialarts.com/account/login"
  SCHEDULE_URL: "https://www.gravitasmartialarts.com/schedule"
  MATTRACKER_URL: "https://mattracker.trimblebarra.com"
  FOLLOWUP_ENABLED: "true"
  FOLLOWUP_DELAY_DAYS: "7"
  FOLLOWUP_GRACE_DAYS: "3"
  FOLLOWUP_POLL_MINUTES: "60"
  DISPLAY_TIMEZONE: "America/Chicago"
  # "Sign in with Google" on the admin page. A client ID is public by design;
  # the client secret is never used.
  GOOGLE_CLIENT_ID: "768385890439-812k6cqllqefp7vknhraeso249mnci4k.apps.googleusercontent.com"
  # Set up MatTracker accounts for new waivers. The token lives in app-secrets
  # (SPARTRACKER_WAIVER_TOKEN); until it is there, nothing is sent.
  SPARTRACKER_WAIVER_URL: "https://mattracker.trimblebarra.com/api/waiver-signed"

postgres:
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: linode-block-storage-retain

backup:
  enabled: true
  schedule: "0 7 * * *"
  objectStorage:
    bucket: postgres-backups
    prefix: waiver-app
    region: us-ord-10
    endpoint: https://us-ord-10.linodeobjects.com
  credentialsSecret:
    name: linode-object-storage
    create: false

backend:
  image:
    repository: dstrimble83/waiver-app-backend

frontend:
  image:
    repository: dstrimble83/waiver-app-frontend

ingress:
  enabled: true
  className: nginx
  host: gravitas.trimblebarra.com
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  tls:
    enabled: false

cloudflared:
  enabled: true
  tokenSecret:
    name: cloudflared-tunnel-token
    create: false
