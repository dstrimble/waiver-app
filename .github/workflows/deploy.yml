name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "charts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

env:
  BACKEND_IMAGE: dstrimble83/waiver-app-backend
  FRONTEND_IMAGE: dstrimble83/waiver-app-frontend

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: backend
            image: dstrimble83/waiver-app-backend
          - context: frontend
            image: dstrimble83/waiver-app-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.context }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ needs.tag.outputs.tag }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}

  deploy:
    needs: [tag, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Helm upgrade
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          helm upgrade --install waiver-app charts/waiver-app \
            -n gravitas --create-namespace \
            -f charts/waiver-app/values-linode.yaml \
            --set backend.image.tag="$TAG" \
            --set frontend.image.tag="$TAG" \
            --wait --timeout 5m

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f "$HOME/.kube/config"
